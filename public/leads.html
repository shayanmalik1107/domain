<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads Management System</title>
    <link rel="stylesheet" href="style.css?v=5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-default);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        /* Login Panel Styles */
        #login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: var(--surface-default);
            padding: 2.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box h2 {
            margin-top: 0;
            color: #fff;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        .login-box input {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            background: var(--bg-default);
            color: var(--text-primary);
            box-sizing: border-box;
            font-family: inherit;
        }
        .login-box input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .login-box button {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .login-box button:hover {
            opacity: 0.9;
        }
        #login-error {
            color: var(--error);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        /* Dashboard Styles */
        #dashboard-container {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: var(--surface-default);
            border-bottom: 1px solid var(--border-light);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #fff;
        }
        .header button {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Excel-like Table Styles */
        .table-wrapper {
            flex: 1;
            overflow: auto;
            background: #fff; /* Excel look */
        }
        table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
        }
        th, td {
            border: 1px solid #d4d4d4;
            padding: 6px 12px;
            color: #333;
            text-align: left;
            white-space: nowrap;
        }
        th {
            background-color: #f3f3f3;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 1px 0 #d4d4d4;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #e8f0fe;
        }
        
        /* Row Numbers */
        td.row-num, th.row-num {
            background-color: #f3f3f3;
            color: #666;
            font-weight: 600;
            text-align: center;
            width: 40px;
            position: sticky;
            left: 0;
            z-index: 5;
            border-right: 2px solid #d4d4d4;
        }
        th.row-num {
            z-index: 15; /* Top left corner */
        }

        .loading-state {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Login Panel -->
    <div id="login-container">
        <div class="login-box">
            <h2>System Login</h2>
            <div id="login-error">Invalid credentials</div>
            <input type="text" id="username" placeholder="Username">
            <div style="position: relative; margin-bottom: 1rem;">
                <input type="password" id="password" placeholder="Password" style="margin-bottom: 0; padding-right: 2.5rem;">
                <button type="button" id="toggle-password" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); width: auto; padding: 4px; cursor: pointer;">
                    <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <button id="login-btn">Secure Login</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-container">
        <div class="header">
            <h1>Leads Database <span id="lead-count" style="font-weight: 400; font-size: 0.9rem; color: var(--text-muted); margin-left: 10px;"></span></h1>
            <a href="/" style="color: var(--accent); text-decoration: none; font-size: 0.9rem; margin-right: 15px;">&larr; Back to Domny</a>
        </div>
        <div class="table-wrapper" id="table-wrapper">
            <div class="loading-state">Loading and parsing Excel data...</div>
        </div>
    </div>

    <script src="leads.js"></script>
</body>
</html>
